<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON OVERDRIVE: AI Space Arcade (Fixed)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ml5@0.12.2/dist/ml5.min.js"></script>
    
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --purple: #bf55ec;
            --dark: #0a0a12;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 0;
            background: radial-gradient(circle at center, #141428 0%, var(--dark) 100%);
            color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        h1 {
            margin: 5px 0 2px 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(90deg, var(--primary), #ff007f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        p.subtitle { margin: 0 0 15px 0; color: #7d7d9c; font-size: 0.95rem; }

        #game-layout {
            display: flex; gap: 20px; padding: 20px; border-radius: 24px;
            background: rgba(20, 20, 35, 0.6); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        #canvas-container {
            border: 3px solid rgba(0, 242, 254, 0.3); border-radius: 16px;
            overflow: hidden; box-shadow: 0 0 30px rgba(0, 242, 254, 0.15); background: #000;
        }

        #sidebar { display: flex; flex-direction: column; gap: 12px; width: 260px; }

        .info-panel {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .info-panel h3 { margin: 0; font-size: 12px; color: #8b8ba7; letter-spacing: 1px; }
        .info-panel p { margin: 0; font-size: 20px; font-weight: bold; }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: #a4b0be; font-weight: bold; }
        .input-group input {
            padding: 10px; border-radius: 8px; border: 1px solid #3a3a5a;
            background: #0f0f1a; color: #fff; font-size: 14px; text-align: center;
        }

        .btn {
            padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px;
            cursor: pointer; transition: all 0.2s ease;
        }
        #btn-start { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #000; font-weight: 900; }
        #btn-start:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,242,254,0.4); }
        #btn-start:disabled { background: #2a2a3a; color: #5a5a7a; cursor: not-allowed; transform: none; box-shadow: none; }

        .shop-box {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            padding: 10px; border-radius: 12px;
        }
        .shop-box h4 { margin: 0 0 8px 0; font-size: 12px; color: var(--primary); text-transform: uppercase; }
        .skin-container { display: flex; gap: 8px; justify-content: center; }
        .skin-btn {
            flex: 1; padding: 8px; font-size: 11px; font-weight: bold; background: #1a1a2e;
            border: 2px solid #3a3a5a; color: #fff; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .skin-btn.active { border-color: var(--success); color: var(--success); background: rgba(46,213,115,0.1); }
        .skin-btn.locked { border-color: #333; color: #666; }

        .leaderboard {
            background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 10px;
            border: 1px solid rgba(255,255,255,0.03); max-height: 110px; overflow-y: auto;
        }
        .leaderboard h4 { margin: 0 0 6px 0; font-size: 12px; color: var(--warning); letter-spacing: 1px; }
        .leaderboard ol { margin: 0; padding-left: 20px; font-size: 12px; color: #ccc; }
    </style>
</head>
<body>

    <h1>⚡ NEON OVERDRIVE AI</h1>
    <p class="subtitle">เวอร์ชันแก้ไขบัคบอสตาย: ปราบบอสแล้วลุยเก็บแต้มฟาร์มเหรียญต่อได้ยาวๆ!</p>

    <div id="game-layout">
        <div id="canvas-container"></div>

        <div id="sidebar">
            <div class="input-group">
                <label>PLAYER NAME</label>
                <input type="text" id="player-name" value="PILOT_X" maxlength="10">
            </div>

            <div class="info-panel">
                <h3>SCORE</h3>
                <p id="score-text" style="color: var(--success);">0</p>
            </div>
            <div class="info-panel">
                <h3>COINS💰</h3>
                <p id="coin-text" style="color: var(--warning);">0</p>
            </div>
            <div class="info-panel">
                <h3>AI CAM</h3>
                <p id="ai-status" style="color: var(--danger); font-size:13px;">LOADING AI...</p>
            </div>

            <div class="shop-box">
                <h4>🛸 CHOOSE YOUR SKIN</h4>
                <div class="skin-container">
                    <button class="skin-btn active" id="skin-cyan" onclick="changeSkin('cyan')">CYAN (FREE)</button>
                    <button class="skin-btn locked" id="skin-pink" onclick="buySkin('pink', 5)">PINK (5💰)</button>
                    <button class="skin-btn locked" id="skin-gold" onclick="buySkin('gold', 15)">GOLD (15💰)</button>
                </div>
            </div>
            
            <button id="btn-start" class="btn" onclick="resetGame()" disabled>START MISSION</button>
            
            <div class="leaderboard">
                <h4>🏆 TOP BEST PILOTS</h4>
                <ol id="leaderboard-list"><li>ไม่มีข้อมูล</li></ol>
            </div>
        </div>
    </div>

    <script>
        let video, facemesh, predictions = [];
        let isAiReady = false;

        let playerX, playerY, playerSize = 34, targetX = 250;
        let playerName = "PILOT_X";
        let activeSkin = 'cyan'; 
        let unlockedSkins = ['cyan'];
        let playerCoins = 0;

        let gameScore = 0, isGameOver = true, speedMultiplier = 1;
        let isFirstLoad = true, currentStage = 1; 
        let hasShield = false; 

        // โครงสร้างข้อมูลบอส
        let boss = { x: 250, y: -100, hp: 100, maxHp: 100, targetY: 80, width: 140, height: 50, laserTimer: 0, laserActive: false, laserX: 0 };
        
        let obstacles = [], items = [], stars = [], particles = [], bullets = [];
        let shakeIntensity = 0; 

        let audioCtx, bgmInterval, bgmStep = 0;
        const bgmNotes = [130.81, 146.83, 164.81, 196.00, 164.81, 146.83, 220.00, 196.00]; 

        function setup() {
            let canvas = createCanvas(500, 500);
            canvas.parent('canvas-container');

            video = createCapture(VIDEO); video.size(500, 500); video.hide();

            for(let i=0; i<80; i++) { 
                stars.push({ x: random(width), y: random(height), speed: random(1, 4), size: random(1, 3.5) });
            }

            facemesh = ml5.facemesh(video, () => {
                isAiReady = true;
                let statusElem = document.getElementById("ai-status");
                statusElem.innerText = "ONLINE"; statusElem.style.color = "var(--success)";
                document.getElementById("btn-start").disabled = false;
            });
            facemesh.on("predict", (results) => { predictions = results; });

            playerX = width / 2; playerY = height - 50;
            loadLeaderboard();
        }

        function draw() {
            background(6, 6, 12); 

            if (shakeIntensity > 0) {
                translate(random(-shakeIntensity, shakeIntensity), random(-shakeIntensity, shakeIntensity));
                shakeIntensity *= 0.9; 
            }

            fill(255, 255, 255, 180); noStroke();
            for(let star of stars) {
                ellipse(star.x, star.y, star.size, star.size);
                star.y += isGameOver ? star.speed * 0.2 : star.speed * speedMultiplier; 
                if(star.y > height) { star.y = 0; star.x = random(width); }
            }

            if (predictions.length > 0) {
                let nose = predictions[0].scaledMesh[5];
                let noseX = width - nose[0];
                targetX = map(noseX, 170, 330, 0, width);
                targetX = constrain(targetX, 20, width - 20);

                push(); translate(width - 85, 10); fill(0,0,0,200); stroke(0,242,254,100); rect(0, 0, 75, 75, 10);
                image(video, 4, 4, 67, 67);
                let miniNoseX = map(nose[0], 0, width, 75, 0); let miniNoseY = map(nose[1], 0, height, 0, 75);
                fill(255, 0, 127); noStroke(); ellipse(miniNoseX, miniNoseY, 6, 6); pop();
            }

            playerX = lerp(playerX, targetX, 0.25);

            if(!isGameOver && frameCount % 2 === 0) {
                particles.push({ x: playerX + random(-5, 5), y: playerY + 15, vx: random(-1, 1), vy: random(2, 5), size: random(4, 8), alpha: 255 });
            }

            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 8;
                let c = getSkinColor(activeSkin); fill(c.r, c.g, c.b, p.alpha); noStroke();
                ellipse(p.x, p.y, p.size, p.size);
                if(p.alpha <= 0) particles.splice(i, 1);
            }

            if (!isGameOver) {
                // ระบบกระสุนยิงออโต้เมื่อเจอบอส
                if (currentStage === 2) {
                    if (frameCount % 12 === 0) {
                        bullets.push({ x: playerX, y: playerY - 20, speed: 8 });
                        playSfx(400, 600, 0.05); 
                    }
                    for (let i = bullets.length - 1; i >= 0; i--) {
                        let b = bullets[i]; b.y -= b.speed;
                        fill(0, 252, 254); noStroke(); rect(b.x - 2, b.y, 4, 12, 2);
                        
                        // ตรวจกระสุนชนบอส
                        if (b.y < boss.y + boss.height/2 && b.x > boss.x - boss.width/2 && b.x < boss.x + boss.width/2 && boss.y > 0) {
                            bullets.splice(i, 1); boss.hp -= 2; triggerShake(3);
                            if (boss.hp <= 0) { 
                                gameScore += 500; playerCoins += 10; updateUi(); 
                                winStage(); // เรียกใช้ฟังก์ชันชนะบอส
                            }
                            continue;
                        }
                        if (b.y < 0) bullets.splice(i, 1);
                    }
                }

                // เงื่อนไขการตัดเข้าด่านบอส (ทำแต้มถึง 300 และต้องอยู่ในสเตจ 1)
                if (gameScore >= 300 && currentStage === 1) { 
                    currentStage = 2; 
                    obstacles = []; 
                    boss.hp = boss.maxHp;
                    boss.y = -100;
                    boss.laserTimer = 0;
                    boss.laserActive = false;
                }

                if (currentStage === 1) {
                    // --- STAGE 1: หลบอุกกาบาต ---
                    if (frameCount % Math.max(6, Math.floor(18 / speedMultiplier)) === 0) {
                        obstacles.push({ x: random(20, width - 20), y: -20, size: random(20, 42), speed: random(4, 7) * speedMultiplier });
                    }
                    for (let i = obstacles.length - 1; i >= 0; i--) {
                        let obs = obstacles[i]; obs.y += obs.speed;
                        fill(255, 71, 87); stroke(255, 100, 100); strokeWeight(1); ellipse(obs.x, obs.y, obs.size, obs.size); noStroke();
                        if (dist(playerX, playerY, obs.x, obs.y) < (playerSize / 2 + obs.size / 2)) {
                            obstacles.splice(i, 1); hitPlayer();
                        } else if (obs.y > height + 20) {
                            obstacles.splice(i, 1); gameScore += 10; updateUi();
                            if (gameScore % 120 === 0) speedMultiplier += 0.12;
                        }
                    }
                } else if (currentStage === 2) {
                    // --- STAGE 2: BOSS FIGHT ---
                    boss.y = lerp(boss.y, boss.targetY, 0.05); 
                    
                    setupNeonGlow(191, 85, 236); fill(150, 40, 200); rect(boss.x - boss.width/2, boss.y - boss.height/2, boss.width, boss.height, 12);
                    fill(255, 0, 128); ellipse(boss.x, boss.y + 10, 30, 15); 
                    
                    // หลอดเลือดบอส
                    noStroke(); fill(40); rect(50, 25, width - 100, 12, 6);
                    let hpWidth = map(boss.hp, 0, boss.maxHp, 0, width - 100);
                    fill(varColor('--purple')); rect(50, 25, hpWidth, 12, 6);
                    
                    // ระบบยิงเลเซอร์
                    boss.laserTimer++;
                    if (boss.laserTimer > 100 && !boss.laserActive) { 
                        boss.laserActive = true; boss.laserX = random(60, width - 60); playSfx(200, 400, 0.2);
                    }
                    if (boss.laserActive) {
                        if (boss.laserTimer < 140) { 
                            stroke(255, 0, 0, 150); strokeWeight(3); line(boss.laserX, boss.y + 20, boss.laserX, height); noStroke();
                        } else if (boss.laserTimer >= 140 && boss.laserTimer < 190) { 
                            setupNeonGlow(255, 0, 128); fill(255, 0, 128); rect(boss.laserX - 35, boss.y + 20, 70, height - boss.y);
                            triggerShake(5); 
                            if (playerX > boss.laserX - 45 && playerX < boss.laserX + 45) {
                                if(frameCount % 10 === 0) hitPlayer(); 
                            }
                        } else { 
                            boss.laserActive = false; boss.laserTimer = 0;
                        }
                    }
                }

                // ระบบไอเทมดร็อป (Coins / Shield)
                if (frameCount % 150 === 0) {
                    let type = random(1) > 0.35 ? 'coin' : 'shield'; 
                    items.push({ x: random(30, width - 30), y: -20, type: type, size: 22, speed: 4 });
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    let it = items[i]; it.y += it.speed;

                    if (it.type === 'coin') { 
                        setupNeonGlow(255, 165, 2); fill(255, 165, 2); ellipse(it.x, it.y, it.size, it.size);
                        fill(255); textSize(11); textStyle(BOLD); text("$", it.x, it.y + 4);
                    } else { 
                        setupNeonGlow(0, 242, 254); fill(0, 150, 255); rect(it.x - 6, it.y - 12, 12, 24, 6);
                        fill(255); textSize(11); text("+", it.x, it.y + 4);
                    }
                    noStroke();

                    if (dist(playerX, playerY, it.x, it.y) < (playerSize / 2 + it.size / 2)) {
                        if (it.type === 'coin') {
                            playerCoins++; gameScore += 30; playSfx(600, 1200, 0.1); triggerShake(4);
                        } else {
                            hasShield = true; playSfx(400, 800, 0.15); 
                        }
                        items.splice(i, 1); updateUi(); continue;
                    }
                    if (it.y > height + 20) items.splice(i, 1);
                }

                // วาดตัวยานผู้เล่น
                let skinColor = getSkinColor(activeSkin);
                setupNeonGlow(skinColor.r, skinColor.g, skinColor.b);
                fill(skinColor.r, skinColor.g, skinColor.b); stroke(255); strokeWeight(1);
                triangle(playerX, playerY - playerSize/2, playerX - playerSize/2, playerY + playerSize/2, playerX + playerSize/2, playerY + playerSize/2);
                rect(playerX - 4, playerY + playerSize/2, 8, 4); 
                noStroke();

                if (hasShield) {
                    noFill(); stroke(0, 242, 254, 200); strokeWeight(3); setupNeonGlow(0, 242, 254);
                    ellipse(playerX, playerY, playerSize * 1.6, playerSize * 1.6); noStroke();
                }
                
            } else {
                fill(0, 0, 0, 150); rect(0, 0, width, height);
                textAlign(CENTER, CENTER); textStyle(BOLD);
                if(!isFirstLoad) {
                    setupNeonGlow(255, 71, 87); fill(255, 71, 87); textSize(45); text("MISSION FAILED", width / 2, height / 2 - 40);
                    fill(255); textSize(18); text(`PILOT: ${playerName}   |   COINS: ${playerCoins} 💰`, width / 2, height / 2 + 10);
                    fill(255, 235, 59); textSize(24); text(`FINAL SCORE: ${gameScore}`, width / 2, height / 2 + 45);
                } else {
                    setupNeonGlow(0, 242, 254); fill(0, 242, 254); textSize(36); text("NEON OVERDRIVE", width / 2, height / 2 - 20);
                    fill(139, 139, 167); textSize(14); text("กรอกชื่อกัปตัน > เลือกช็อปสกิน > กดปุ่ม START ด้านขวาได้เลย!", width / 2, height / 2 + 25);
                }
            }
        }

        function getSkinColor(skin) {
            if(skin === 'pink') return {r: 255, g: 0, b: 127};
            if(skin === 'gold') return {r: 255, g: 195, b: 18};
            return {r: 0, g: 242, b: 254}; 
        }

        function setupNeonGlow(r, g, b) {
            drawingContext.shadowBlur = 20; drawingContext.shadowColor = color(r, g, b);
        }

        function triggerShake(intensity) { shakeIntensity = intensity; }

        function hitPlayer() {
            if (hasShield) { 
                hasShield = false; playSfx(300, 150, 0.25); triggerShake(12);
            } else { 
                endGame();
            }
        }

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        function startBgm() {
            initAudio(); stopBgm(); bgmStep = 0;
            bgmInterval = setInterval(() => {
                if (isGameOver) return;
                try {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.type = currentStage === 2 ? "sawtooth" : "triangle"; 
                    osc.frequency.setValueAtTime(bgmNotes[bgmStep % bgmNotes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.23);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                    bgmStep++;
                } catch(e){}
            }, 240);
        }

        function stopBgm() { if (bgmInterval) clearInterval(bgmInterval); }

        function playSfx(startFreq, endFreq, duration) {
            initAudio();
            try {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = "sawtooth"; osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function resetGame() {
            playerName = document.getElementById("player-name").value.trim().toUpperCase() || "PILOT";
            obstacles = []; items = []; bullets = []; currentStage = 1; hasShield = false;
            
            // 🛠️ FIX: ล้างค่าตัวแปรบอสทั้งหมดให้สะอาดตอนกดเริ่มเกมใหม่
            boss.hp = boss.maxHp; 
            boss.y = -100; 
            boss.laserTimer = 0; 
            boss.laserActive = false;
            
            gameScore = 0; speedMultiplier = 1; isGameOver = false; isFirstLoad = false;
            updateUi(); document.getElementById("btn-start").innerText = "ABORT MISSION";
            startBgm();
        }

        // 🛠️ FIX: ฟังก์ชันชนะบอสที่ได้รับการแก้ไข ล้างวิญญาณเลเซอร์ไม่ให้ค้างคาด่านถัดไป
        function winStage() { 
            currentStage = 1; // กลับไปด่านปกติหลบอุกกาบาต
            boss.y = -200; // เตะบอสออกไปนอกจอไกลๆ
            boss.laserActive = false; // ปิดสถานะเลเซอร์ทันที
            boss.laserTimer = 0; // รีเซ็ตตัวนับเวลาเลเซอร์เป็นศูนย์
            speedMultiplier += 0.25; // เพิ่มความยากของเกมนิดหน่อยเป็นรางวัลที่ชนะบอส 555
            playSfx(800, 1600, 0.5); triggerShake(25);
        }

        function endGame() {
            isGameOver = true; stopBgm(); playSfx(120, 30, 0.5); triggerShake(25);
            saveScore(playerName, gameScore); loadLeaderboard();
            document.getElementById("btn-start").innerText = "RE-DEPLOY";
        }

        function changeSkin(skin) {
            if (unlockedSkins.includes(skin)) {
                activeSkin = skin;
                document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`skin-${skin}`).classList.add('active');
            }
        }

        function buySkin(skin, cost) {
            if (unlockedSkins.includes(skin)) { changeSkin(skin); return; }
            if (playerCoins >= cost) {
                playerCoins -= cost; unlockedSkins.push(skin); updateUi();
                let btn = document.getElementById(`skin-${skin}`);
                btn.classList.remove('locked'); btn.innerText = skin.toUpperCase();
                changeSkin(skin); playSfx(600, 1000, 0.2);
            } else {
                alert(`เหรียญทองไม่พอ! สกินนี้ใช้ ${cost}💰 (ตอนนี้คุณมี ${playerCoins}💰)`);
            }
        }

        function updateUi() {
            document.getElementById("score-text").innerText = gameScore;
            document.getElementById("coin-text").innerText = playerCoins;
        }

        function saveScore(name, score) {
            let scores = JSON.parse(localStorage.getItem("modernDodgeScores")) || [];
            let existIdx = scores.findIndex(s => s.name === name);
            if (existIdx !== -1) { if (score > scores[existIdx].score) scores[existIdx].score = score; } 
            else { scores.push({ name: name, score: score }); }
            scores.sort((a, b) => b.score - a.score); scores = scores.slice(0, 5);
            localStorage.setItem("modernDodgeScores", JSON.stringify(scores));
        }

        function loadLeaderboard() {
            let scores = JSON.parse(localStorage.getItem("modernDodgeScores")) || [];
            let listElem = document.getElementById("leaderboard-list");
            if (scores.length === 0) { listElem.innerHTML = "<li>ไม่มีบันทึกข้อมูล</li>"; return; }
            listElem.innerHTML = scores.map(s => `<li><b>${s.name}</b>: ${s.score} PTS</li>`).join("");
        }

        function varColor(name) {
            return color(getComputedStyle(document.documentElement).getPropertyValue(name).trim());
        }
    </script>
</body>
</html>
